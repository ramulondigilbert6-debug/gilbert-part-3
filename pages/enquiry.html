<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Spark Electrical | Request a Quote</title>
    <link rel="stylesheet" href="../Micellanous/style.css">
    <script src="../script.js/main.js"></script>
   <script src="../script.js/validation.js"></script>
</head>
<body>

    <!-- Main Navigation Header -->
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <h2>Request a Fast Service Quote</h2>
            <p>Fill out the form below to receive a detailed cost estimate for your electrical or solar project.</p>
        </section>

        <!-- Interactive Quote Request Form -->
        <section class="form-section">
            <div class="form-container">
                <form action="#" method="POST" class="enquiry-form">
                    
                    <!-- Customer Contact Details -->
                    <fieldset>
                        <legend>Customer Information</legend>
                        
                        <div class="form-group">
                            <label for="fullname">Full Name / Business Name *</label>
                            <input type="text" id="fullname" name="fullname" placeholder="e.g., John Smith or ABC Enterprise" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="e.g., john@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Contact Phone Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="e.g., 015 291 0000" required>
                        </div>

                        <div class="form-group">
                            <label for="address">Property Physical Address / Location *</label>
                            <input type="text" id="address" name="address" placeholder="e.g., Bendor, Polokwane" required>
                        </div>
                    </fieldset>

                    <!-- Service Selection Fields -->
                    <fieldset>
                        <legend>Service Specifications</legend>

                        <div class="form-group">
                            <label for="service-type">Required Service Category *</label>
                            <select id="service-type" name="servicetype" required>
                                <option value="">-- Select Required Service --</option>
                                <option value="solar">Solar Power / Inverter Installation</option>
                                <option value="wiring">Residential or Commercial Wiring</option>
                                <option value="fault">Fault Finding / Emergency Repair</option>
                                <option value="coc">Certificate of Compliance (CoC) Inspection</option>
                                <option value="generator">Generator Installation & Backup</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="urgency">Service Urgency</label>
                            <select id="urgency" name="urgency">
                                <option value="standard">Standard Project (Within 1-2 Weeks)</option>
                                <option value="urgent">Urgent Service (Within 24-48 Hours)</option>
                                <option value="emergency">Immediate Emergency Callout</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message">Detailed Description of Work Required *</label>
                            <textarea id="message" name="message" rows="5" placeholder="Provide details regarding the electrical issue, property size, or solar load requirements..." required></textarea>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn btn-primary">Submit Quote Request</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Bright Spark Electrical. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
